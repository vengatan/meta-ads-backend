name: Meta Secure Runner V3
on:
  push:
    paths:
      - '.github/workflows/meta-secure-runner-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publish ephemeral public key
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/meta_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/meta_private.pem -pubout -out /tmp/meta_public.pem >/dev/null 2>&1
          base64 -w0 /tmp/meta_public.pem > /tmp/meta_public.pem.b64
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          api='https://api.github.com/repos/vengatan/meta-ads-backend/contents/.secure/meta_public.pem.b64'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=30) as r: sha=json.loads(r.read().decode()).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          raw=open('/tmp/meta_public.pem.b64','rb').read()
          body={'message':'Publish ephemeral Meta public key v3','content':base64.b64encode(raw).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: r.read()
          print('EPHEMERAL_PUBLIC_KEY_PUBLISHED')
          PY

      - name: Wait for encrypted token through GitHub API
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64,json,os,time,urllib.request,urllib.error
          api='https://api.github.com/repos/vengatan/meta-ads-backend/contents/.secure/meta_token.enc?ref=main'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-cache'}
          for i in range(120):
              try:
                  req=urllib.request.Request(api,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as r:
                      obj=json.loads(r.read().decode())
                  file_bytes=base64.b64decode(obj['content'])
                  if file_bytes.strip():
                      open('/tmp/meta_token.b64','wb').write(file_bytes.strip())
                      print('ENCRYPTED_TOKEN_RECEIVED')
                      break
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
              time.sleep(5)
          else:
              raise SystemExit('Encrypted token was not received in time')

      - name: Decrypt and execute capped Meta tests
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/meta_token.b64 > /tmp/meta_token.bin
          openssl pkeyutl -decrypt -inkey /tmp/meta_private.pem -in /tmp/meta_token.bin -out /tmp/meta_token.txt
          chmod 600 /tmp/meta_token.txt
          python meta_ops.py
