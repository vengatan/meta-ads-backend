name: Meta Secure Runner
on:
  push:
    paths:
      - '.github/workflows/meta-secure-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create ephemeral encryption key and wait for encrypted token
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/meta_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/meta_private.pem -pubout -out /tmp/meta_public.pem >/dev/null 2>&1
          echo "META_EPHEMERAL_PUBLIC_KEY_B64=$(base64 -w0 /tmp/meta_public.pem)"
          URL="https://raw.githubusercontent.com/vengatan/meta-ads-backend/main/.secure/meta_token.enc"
          found=0
          for i in $(seq 1 72); do
            if curl -fsSL -H 'Cache-Control: no-cache' "${URL}?t=$(date +%s%N)" -o /tmp/meta_token.b64 2>/dev/null; then
              if [ -s /tmp/meta_token.b64 ]; then found=1; break; fi
            fi
            sleep 5
          done
          if [ "$found" != "1" ]; then echo 'Encrypted token was not received in time'; exit 1; fi
          base64 -d /tmp/meta_token.b64 > /tmp/meta_token.bin
          openssl pkeyutl -decrypt -inkey /tmp/meta_private.pem -in /tmp/meta_token.bin -out /tmp/meta_token.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/meta_token.txt

      - name: Create capped cold-profile tests
        shell: python
        env:
          GRAPH_VERSION: v25.0
        run: |
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timedelta, timezone

          with open('/tmp/meta_token.txt','r',encoding='utf-8') as f:
              TOKEN=f.read().strip()
          if not TOKEN:
              raise SystemExit('No decrypted token')

          GV=os.environ.get('GRAPH_VERSION','v25.0')
          BASE=f'https://graph.facebook.com/{GV}'

          def request(method, path, params=None):
              url=BASE+'/'+path.lstrip('/')
              data=None
              if params is not None:
                  enc={}
                  for k,v in params.items():
                      if isinstance(v,(dict,list,bool)):
                          enc[k]=json.dumps(v,separators=(',',':'))
                      elif v is not None:
                          enc[k]=str(v)
                  data=urllib.parse.urlencode(enc).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'Authorization':'Bearer '+TOKEN})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      body=r.read().decode()
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  print(f'META_ERROR {method} {path} HTTP {e.code}: {body}')
                  raise
              out=json.loads(body)
              if isinstance(out,dict) and out.get('error'):
                  print(f'META_ERROR {method} {path}: {json.dumps(out)}')
                  raise RuntimeError(out['error'])
              return out

          def post(path, **params): return request('POST',path,params)
          def get(path, **params):
              q=urllib.parse.urlencode({k:(json.dumps(v,separators=(',',':')) if isinstance(v,(dict,list,bool)) else str(v)) for k,v in params.items()})
              return request('GET',path+('?' + q if q else ''))

          SG='act_239740063602735'
          TW='act_586574771435951'

          # Verify the user token itself can see both accounts before any write.
          accts=get('me/adaccounts',fields='id,name,currency,account_status',limit=500)
          ids={x.get('id') for x in accts.get('data',[])}
          missing=[x for x in (SG,TW) if x not in ids]
          if missing:
              raise SystemExit('Token does not expose required account(s): '+','.join(missing))
          print('TOKEN_ACCOUNT_CHECK=PASS SG+TW')

          now=datetime.now(timezone.utc)
          start=(now+timedelta(minutes=20)).replace(microsecond=0)
          end=start+timedelta(days=14)
          start_s=start.strftime('%Y-%m-%dT%H:%M:%S%z')
          end_s=end.strftime('%Y-%m-%dT%H:%M:%S%z')
          stamp=now.strftime('%Y%m%d-%H%M')

          # Pure cold profiles only: no customer, purchaser, order, site-visitor, or health-derived audiences.
          common_places={
              'publisher_platforms':['facebook','instagram'],
              'facebook_positions':['feed','story'],
              'instagram_positions':['stream','story','reels'],
              'device_platforms':['mobile','desktop'],
          }

          sg_cells=[
              ('Tech-Finance', {'interests':[
                  {'id':'6003985771306','name':'Technology (computers and electronics)'},
                  {'id':'6003164535634','name':'Information technology (computers and electronics)'},
                  {'id':'444620642403378','name':'Financial technology'}]}),
              ('Dining-Cafe', {'interests':[
                  {'id':'6003436950375','name':'Restaurants (dining)'},
                  {'id':'6003626773307','name':'Coffee (food and drink)'},
                  {'id':'6003120620858','name':'Coffeehouses (coffee)'}]}),
              ('Nightlife-EDM', {'interests':[
                  {'id':'6003375995381','name':'nightlife (bars, clubs and nightlife)'},
                  {'id':'6003361714600','name':'Nightclubs (bars, clubs and nightlife)'},
                  {'id':'6003155409305','name':'Electronic dance music (music)'}]})
          ]
          tw_cells=[
              ('Nightlife', {'interests':[
                  {'id':'6003375995381','name':'nightlife (bars, clubs and nightlife)'},
                  {'id':'6003361714600','name':'Nightclubs (bars, clubs and nightlife)'},
                  {'id':'6003155409305','name':'Electronic dance music (music)'}]}),
              ('Engaged-Shoppers', {'behaviors':[
                  {'id':'6071631541183','name':'Engaged shoppers'}]}),
              ('Dining-Cafe', {'interests':[
                  {'id':'6003436950375','name':'Restaurants (dining)'},
                  {'id':'6003626773307','name':'Coffee (food and drink)'},
                  {'id':'6003120620858','name':'Coffeehouses (coffee)'}]})
          ]

          created={'campaigns':{},'adsets':[],'ads':[]}
          try:
              for market, account, campaign_name, pixel, cells, lifetime, age_min, age_max, creative_id in [
                  ('SG',SG,f'VMG Cold Profile Lab SG {stamp}','244962973380244',sg_cells,9800,24,50,'1677420986472049'),
                  ('TW',TW,f'VMG Cold Profile Lab TW {stamp}','209850509573148',tw_cells,7000,25,50,'1651679552211797')
              ]:
                  c=post(f'{account}/campaigns',name=campaign_name,objective='OUTCOME_SALES',status='PAUSED',special_ad_categories=[])
                  cid=c['id']; created['campaigns'][market]=cid
                  print(f'CREATED_CAMPAIGN {market} {cid} PAUSED')

                  for cell_name, profile in cells:
                      targeting={
                          'age_min':age_min,'age_max':age_max,'genders':[1],
                          'geo_locations':{'countries':[market],'location_types':['home','recent']},
                          'flexible_spec':[profile],
                          'targeting_automation':{'advantage_audience':0,'individual_setting':{'age':0,'gender':0,'geo':0}},
                          **common_places
                      }
                      a=post(f'{account}/adsets',
                          name=f'{market} Profile {cell_name} | 14d capped',
                          campaign_id=cid,
                          lifetime_budget=lifetime,
                          billing_event='IMPRESSIONS',optimization_goal='OFFSITE_CONVERSIONS',
                          bid_strategy='LOWEST_COST_WITHOUT_CAP',
                          promoted_object={'pixel_id':pixel,'custom_event_type':'PURCHASE'},
                          attribution_spec=[{'event_type':'CLICK_THROUGH','window_days':7},{'event_type':'VIEW_THROUGH','window_days':1}],
                          targeting=targeting,start_time=start_s,end_time=end_s,status='ACTIVE')
                      aid=a['id']; created['adsets'].append((market,cell_name,aid))
                      print(f'CREATED_ADSET {market} {cell_name} {aid} ACTIVE_UNDER_PAUSED_CAMPAIGN')
                      ad=post(f'{account}/ads',name=f'{market} Profile {cell_name} | Control creative',adset_id=aid,creative={'creative_id':creative_id},status='ACTIVE')
                      adid=ad['id']; created['ads'].append((market,cell_name,adid))
                      print(f'CREATED_AD {market} {cell_name} {adid}')

              # Validate all six adsets before activating either campaign.
              for market,cell,aid in created['adsets']:
                  obj=get(aid,fields='id,name,status,effective_status,lifetime_budget,start_time,end_time,targeting,optimization_goal,promoted_object')
                  if str(obj.get('status'))!='ACTIVE':
                      raise RuntimeError(f'Validation failed: {aid} not ACTIVE')
                  if str(obj.get('optimization_goal'))!='OFFSITE_CONVERSIONS':
                      raise RuntimeError(f'Validation failed: {aid} optimization')
                  print(f'VALIDATED_ADSET {market} {cell} {aid} lifetime={obj.get("lifetime_budget")}')

              # Activate only after every cell exists and validates.
              for market,cid in created['campaigns'].items():
                  post(cid,status='ACTIVE')
                  chk=get(cid,fields='id,name,status,effective_status')
                  print(f'ACTIVATED_CAMPAIGN {market} {cid} status={chk.get("status")} effective={chk.get("effective_status")}')

              print('RESULT=SUCCESS')
              print('SCHEDULE_START_UTC='+start_s)
              print('SCHEDULE_END_UTC='+end_s)
              print('SG_TOTAL_LIFETIME_MINOR=29400')
              print('TW_TOTAL_LIFETIME_MINOR=21000')
          except Exception as e:
              # Safety: campaigns were created PAUSED. If anything fails after one activation, pause both.
              for market,cid in created['campaigns'].items():
                  try:
                      post(cid,status='PAUSED')
                      print(f'SAFETY_PAUSED {market} {cid}')
                  except Exception as pe:
                      print(f'SAFETY_PAUSE_FAILED {market} {cid}: {pe}')
              print('RESULT=FAILED '+repr(e))
              raise
          finally:
              try: os.remove('/tmp/meta_token.txt')
              except OSError: pass
