name: Meta Fix SG Creative
on:
  push:
    paths:
      - '.github/workflows/meta-fix-sg-creative.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish run-specific ephemeral public key
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/meta_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/meta_private.pem -pubout -out /tmp/meta_public.pem >/dev/null 2>&1
          base64 -w0 /tmp/meta_public.pem > /tmp/meta_public.pem.b64
          python - <<'PY'
          import base64,json,os,urllib.request
          rid=os.environ['GITHUB_RUN_ID']; path=f'.secure/meta_public_{rid}.pem.b64'
          api=f'https://api.github.com/repos/vengatan/meta-ads-backend/contents/{path}'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          raw=open('/tmp/meta_public.pem.b64','rb').read(); body={'message':f'Publish SG repair key {rid}','content':base64.b64encode(raw).decode()}
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers={**h,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r:r.read()
          print('EPHEMERAL_PUBLIC_KEY_PUBLISHED',rid)
          PY
      - name: Wait for run-specific encrypted token
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64,json,os,time,urllib.request,urllib.error
          rid=os.environ['GITHUB_RUN_ID']; path=f'.secure/meta_token_{rid}.hex'
          api=f'https://api.github.com/repos/vengatan/meta-ads-backend/contents/{path}?ref=main'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-cache'}
          for _ in range(120):
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,headers=h),timeout=30) as r: obj=json.loads(r.read().decode())
                  cipher=bytes.fromhex(base64.b64decode(obj['content']).decode().strip())
                  if len(cipher)==512:
                      open('/tmp/meta_token.bin','wb').write(cipher); print('ENCRYPTED_TOKEN_RECEIVED',rid); break
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
              time.sleep(5)
          else: raise SystemExit('Encrypted token not received')
      - name: Repair SG ads
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/meta_private.pem -in /tmp/meta_token.bin -out /tmp/meta_token.txt
          chmod 600 /tmp/meta_token.txt
          python fix_sg_ads.py
