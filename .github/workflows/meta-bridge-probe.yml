name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Meta bridge write routes with GET only
        shell: bash
        run: |
          set -e
          base='https://vensure-meta-ads-bridge.vercel.app'
          paths=(
            '/api/meta/status' '/api/meta/budget' '/api/meta/campaign' '/api/meta/object'
            '/api/meta/set-status' '/api/meta/set-budget' '/api/meta/create-campaign' '/api/meta/update-object'
            '/api/set_status' '/api/set_budget' '/api/create_campaign' '/api/update_object'
            '/api/status' '/api/budget' '/api/campaign' '/api/object'
          )
          for p in "${paths[@]}"; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$base$p")
            printf '%s %s ' "$code" "$p"
            head -c 240 /tmp/body | tr '\n' ' '
            echo
          done
