name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

# Safe no-op schema probe: deliberately invalid operations and no Meta object IDs.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Meta bridge POST schema safely
        run: |
          set -e
          for payload in \
            '{"action":"bogus"}' \
            '{"op":"bogus"}' \
            '{"operation":"bogus"}' \
            '{"action":"set_status"}' \
            '{"action":"set_budget"}' \
            '{"action":"update_object"}' \
            '{"action":"create_campaign"}'; do
            echo "--- $payload"
            curl -sS -X POST 'https://vensure-meta-ads-bridge.vercel.app/api/meta' \
              -H 'Content-Type: application/json' --data "$payload"
            echo
          done
