name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Meta bridge session operations safely
        shell: bash
        run: |
          set -e
          base='https://vensure-meta-ads-bridge.vercel.app/api/meta'
          ops=(login session start_session create_session auth help info)
          for op in "${ops[@]}"; do
            echo "--- POST op=$op"
            curl -sS -X POST "$base?op=$op" -H 'Content-Type: application/json' --data '{}'
            echo
          done
