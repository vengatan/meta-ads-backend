name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_MARKETING_ACCESS_TOKEN: ${{ secrets.META_MARKETING_ACCESS_TOKEN }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
    steps:
      - name: Check only whether Meta token secrets exist
        shell: bash
        run: |
          for n in META_ACCESS_TOKEN META_MARKETING_ACCESS_TOKEN FACEBOOK_ACCESS_TOKEN; do
            if [ -n "${!n}" ]; then echo "$n=PRESENT"; else echo "$n=MISSING"; fi
          done
