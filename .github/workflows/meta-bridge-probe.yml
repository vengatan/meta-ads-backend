name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Meta bridge POST query selector safely
        shell: bash
        run: |
          set -e
          base='https://vensure-meta-ads-bridge.vercel.app/api/meta'
          urls=(
            "$base?op=set_status" "$base?action=set_status" "$base?write=set_status"
            "$base?operation=set_status" "$base?cmd=set_status" "$base?mode=set_status"
          )
          for u in "${urls[@]}"; do
            echo "--- $u"
            curl -sS -i -X POST "$u" -H 'Content-Type: application/json' --data '{}' | tail -n 1
            echo
          done
