name: Meta Bridge Probe
on:
  push:
    paths:
      - '.github/workflows/meta-bridge-probe.yml'
  workflow_dispatch:

# Safe no-op schema probe: deliberately incomplete requests and no Meta object IDs.
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Meta bridge write selector safely
        run: |
          set -e
          for payload in \
            '{"write":"bogus"}' \
            '{"write":"set_status"}' \
            '{"write":"set_budget"}' \
            '{"write":"update_object"}' \
            '{"write":"create_campaign"}' \
            '{"type":"set_status"}' \
            '{"command":"set_status"}'; do
            echo "--- $payload"
            curl -sS -i -X POST 'https://vensure-meta-ads-bridge.vercel.app/api/meta' \
              -H 'Content-Type: application/json' --data "$payload" | tail -n 1
            echo
          done
